name: Build desktop installers

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows
            os: windows-latest
            bundles: nsis,msi
            artifact: windows
            files: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
          - label: macOS Apple Silicon
            os: macos-15
            bundles: dmg
            artifact: macos-arm64
            files: src-tauri/target/release/bundle/dmg/*.dmg
          - label: macOS Intel
            os: macos-15-intel
            bundles: dmg
            artifact: macos-x64
            files: src-tauri/target/release/bundle/dmg/*.dmg
          - label: Linux
            os: ubuntu-22.04
            bundles: appimage,deb
            artifact: linux
            files: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - name: Check release tag matches the desktop version
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        run: |
          APP_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json', 'utf8')).version")
          WEB_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")
          TAG_VERSION="${GITHUB_REF_NAME#desktop-v}"
          if [ "$APP_VERSION" != "$TAG_VERSION" ] || [ "$WEB_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME must match both Tauri version $APP_VERSION and website version $WEB_VERSION"
            exit 1
          fi
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 libwebkit2gtk-4.1-dev
      - run: pnpm install --frozen-lockfile
      - name: Build installers
        run: pnpm desktop:build -- --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14

  draft-release:
    name: Attach installers to a draft release
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: JARVIS ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: release-assets/**
