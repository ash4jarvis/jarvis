name: Build Windows JARVIS installers

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 installers
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - name: Check release tag matches the app and website versions
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        run: |
          APP_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json', 'utf8')).version")
          CARGO_VERSION=$(grep -m1 '^version = "' src-tauri/Cargo.toml | cut -d '"' -f 2)
          WEB_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")
          TAG_VERSION="${GITHUB_REF_NAME#desktop-v}"
          if [ "$APP_VERSION" != "$TAG_VERSION" ] || [ "$CARGO_VERSION" != "$TAG_VERSION" ] || [ "$WEB_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME must match Tauri config ($APP_VERSION), Rust package ($CARGO_VERSION), and website ($WEB_VERSION) versions"
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - name: Build Windows EXE and MSI installers
        run: pnpm desktop:build -- --bundles nsis,msi
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14

  draft-release:
    name: Attach Windows installers to a draft release
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: jarvis-windows
          path: release-assets
      - uses: softprops/action-gh-release@v2
        with:
          name: JARVIS ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: release-assets/**
