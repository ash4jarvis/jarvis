name: Build JARVIS desktop installers

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 installers
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - name: Check release tag matches app versions
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        run: |
          APP_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json', 'utf8')).version")
          CARGO_VERSION=$(grep -m1 '^version = "' src-tauri/Cargo.toml | cut -d '"' -f 2)
          WEB_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")
          TAG_VERSION="${GITHUB_REF_NAME#desktop-v}"
          if [ "$APP_VERSION" != "$TAG_VERSION" ] || [ "$CARGO_VERSION" != "$TAG_VERSION" ] || [ "$WEB_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag version must match Tauri, Rust, and website versions"
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - name: Build Windows EXE and MSI installers
        run: pnpm exec tauri build --config src-tauri/tauri.conf.json --bundles nsis,msi
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14

  build-macos:
    name: Build macOS ${{ matrix.arch }} DMG
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
            arch: arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: x64
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - name: Build macOS disk image
        run: pnpm exec tauri build --config src-tauri/tauri.conf.json --target ${{ matrix.target }} --bundles dmg
      - name: Name release asset
        run: |
          mkdir -p release-assets
          APP_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json', 'utf8')).version")
          cp src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg "release-assets/JARVIS_${APP_VERSION}_${{ matrix.arch }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-macos-${{ matrix.arch }}
          path: release-assets/*.dmg
          if-no-files-found: error
          retention-days: 14

  build-linux:
    name: Build Linux x64 AppImage and DEB
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2
      - run: pnpm install --frozen-lockfile
      - name: Build Linux AppImage and DEB packages
        run: pnpm exec tauri build --config src-tauri/tauri.conf.json --bundles appimage,deb
      - name: Name release assets
        run: |
          mkdir -p release-assets
          APP_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json', 'utf8')).version")
          cp src-tauri/target/release/bundle/appimage/*.AppImage "release-assets/JARVIS_${APP_VERSION}_x86_64.AppImage"
          cp src-tauri/target/release/bundle/deb/*.deb "release-assets/JARVIS_${APP_VERSION}_amd64.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-linux-x64
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  draft-release:
    name: Attach platform installers to a draft release
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: JARVIS ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: release-assets/**
